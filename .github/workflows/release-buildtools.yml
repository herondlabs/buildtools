name: Package and Release Build Tools

on:
  # Trigger automatically when code is pushed or merged to main
  push:
    branches:
      - main
      
  # Allow manual trigger via GitHub Actions UI for testing
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (X.Y.Z). Leave empty for auto-increment'
        required: false
        type: string
        default: ''

# Grant write permissions necessary for creating a GitHub Release
permissions:
  contents: write

jobs:
  package-and-release:
    name: Create tar.gz and Publish Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          clean: true

      - name: Determine Version and Tag
        id: get_version
        run: |
          # 1. Get the latest tag. If no tags exist, default to a base version that will yield v1.0.1
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          
          # Remove the 'v' prefix for arithmetic operations
          VERSION_ONLY=${LATEST_TAG#v}
          
          # Split the version string into X, Y, and Z components
          IFS='.' read -r X Y Z <<< "$VERSION_ONLY"
          
          # Get the branch name where the workflow is currently running
          CURRENT_BRANCH=${GITHUB_REF_NAME}
          echo "Current branch: $CURRENT_BRANCH"
          
          # 2. Calculate the final tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            # Use manual input if provided
            FINAL_TAG="${{ inputs.version }}"
          else
            # Auto-increment logic
            if [ "$CURRENT_BRANCH" == "main" ]; then
              # On main branch: Increment minor version (Y), reset patch version (Z)
              NEW_Y=$((Y + 1))
              FINAL_TAG="v${X}.${NEW_Y}.0"
            else
              # On other branches: Increment patch version (Z)
              NEW_Z=$((Z + 1))
              FINAL_TAG="v${X}.${Y}.${NEW_Z}"
            fi
          fi
          
          # Ensure the final tag string always starts with a 'v'
          FINAL_TAG="v${FINAL_TAG#v}"
          
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "Determined Tag: $FINAL_TAG"

      - name: Create tar.gz archive
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          ARCHIVE_NAME="${REPO_NAME}-${{ env.FINAL_TAG }}.tar.gz"
          
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "Starting to compress the workspace into $ARCHIVE_NAME..."
          
          # Output the tar file to the parent directory (../) to prevent "file changed as we read it" error
          tar --exclude='.git' --exclude='.DS_Store' -czvf "../$ARCHIVE_NAME" .
          
          # Move the completed archive back into the current workspace
          mv "../$ARCHIVE_NAME" .
          
          echo "Compression completed successfully."

      - name: Create GitHub Release and Upload Asset
        # CRITICAL: Only execute this step if the workflow is running on the main branch
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FINAL_TAG }}
          name: Release ${{ env.FINAL_TAG }}
          files: ${{ env.ARCHIVE_NAME }}
          draft: false 
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}