name: Package and Release Build Tools

on:
  # Automatically trigger when code is pushed/merged to the main branch
  push:
    branches:
      - main
      
  # Allow manual trigger via GitHub Actions UI for development builds on any branch
  # NOTE: Inputs have been removed. The system strictly uses auto-increment.
  workflow_dispatch:

# Grant write permissions necessary for creating a GitHub Release and pushing tags
permissions:
  contents: write

jobs:
  package-and-release:
    name: Create tar.gz and Publish Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to fetch all tags for accurate version calculation
          fetch-depth: 0 
          clean: true

      - name: Determine Version, Tag, and Release Type
        id: get_version
        run: |
          # STEP 1: Sync local runner with remote tags to ensure accuracy
          git fetch --tags --force
          
          # STEP 2: Find the absolute highest tag in the repository using Version Sort (-V)
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          
          # Fallback if the repository has absolutely no tags yet
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          
          echo "Highest tag found in repo: $LATEST_TAG"
          
          # STEP 3: Parse the highest tag into X, Y, Z components
          VERSION_ONLY=${LATEST_TAG#v}
          IFS='.' read -r X Y Z <<< "$VERSION_ONLY"
          
          CURRENT_BRANCH=${GITHUB_REF_NAME}
          echo "Current branch: $CURRENT_BRANCH"
          
          # STEP 4: Pure Auto-increment logic based on the current branch
          if [ "$CURRENT_BRANCH" == "main" ]; then
            # Main branch (Release): Increment Y, reset Z to 0
            NEW_Y=$((Y + 1))
            FINAL_TAG="v${X}.${NEW_Y}.0"
            IS_PRERELEASE="false"
            RELEASE_TITLE_PREFIX="Release"
          else
            # Other branches (Development): Increment Z only, keep Y the same
            NEW_Z=$((Z + 1))
            FINAL_TAG="v${X}.${Y}.${NEW_Z}"
            IS_PRERELEASE="true"
            RELEASE_TITLE_PREFIX="Development"
          fi
          
          # Ensure final format is correct (e.g., v1.1.0)
          FINAL_TAG="v${FINAL_TAG#v}"
          RELEASE_TITLE="${RELEASE_TITLE_PREFIX} ${FINAL_TAG}"
          
          # Export variables for subsequent steps
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          
          echo "Determined Tag: $FINAL_TAG"
          echo "Release Title: $RELEASE_TITLE"

      - name: Create tar.gz archive
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          ARCHIVE_NAME="${REPO_NAME}-${{ env.FINAL_TAG }}.tar.gz"
          
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "Starting to compress the workspace into $ARCHIVE_NAME..."
          
          # Compress to parent directory to avoid recursive compression errors (file changed as we read it)
          tar --exclude='.git' --exclude='.DS_Store' -czvf "../$ARCHIVE_NAME" .
          
          # Move the archive back into the workspace
          mv "../$ARCHIVE_NAME" .
          
          echo "Compression completed successfully."

      - name: Create Git Tag and Push to Remote
        run: |
          # Configure git identity for the automation bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Creating local tag: ${{ env.FINAL_TAG }}"
          git tag -a "${{ env.FINAL_TAG }}" -m "${{ env.RELEASE_TITLE }}"

          # Push the tag. We do NOT use --force here. 
          # If the tag somehow exists remotely, this command will fail safely.
          git push origin "${{ env.FINAL_TAG }}"
          
          echo "Tag ${{ env.FINAL_TAG }} has been successfully pushed to origin."

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          # Pin the release to the exact commit SHA being built
          target_commitish: ${{ github.sha }}
          tag_name: ${{ env.FINAL_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: ${{ env.ARCHIVE_NAME }}
          draft: false 
          # Toggle Pre-release status dynamically based on the branch
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          # Automatically generate a changelog based on commits between this tag and the previous one
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}