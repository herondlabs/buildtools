name: Package and Release Build Tools

on:
  # Automatically trigger when code is pushed/merged to the main branch
  push:
    branches:
      - main
      
  # Allow manual trigger via GitHub Actions UI for development builds on any branch
  workflow_dispatch:

# Grant write permissions necessary for creating a GitHub Release and pushing tags
permissions:
  contents: write

jobs:
  package-and-release:
    name: Auto Release Builder
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to fetch all tags for accurate version calculation
          fetch-depth: 0 
          clean: true

      - name: Execute Node.js Release Logic
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const { owner, repo } = context.repo;
            const currentBranch = process.env.GITHUB_REF_NAME;

            core.info(`Starting Auto-Release Process for branch: ${currentBranch}`);

            // 1. Fetch all tags from the remote to ensure local state is updated
            execSync('git fetch --tags --force');

            // 2. Get all tags starting with 'v' and sort them using Semantic Versioning
            const tagsOutput = execSync('git tag -l "v*"').toString();
            const tags = tagsOutput.split('\n').map(t => t.trim()).filter(Boolean);
            
            tags.sort((a, b) => {
              const pa = a.replace(/^v/, '').split('.').map(Number);
              const pb = b.replace(/^v/, '').split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (pa[i] > pb[i]) return 1;
                if (pa[i] < pb[i]) return -1;
              }
              return 0;
            });

            // 3. Determine the latest tag (Fallback to v1.0.0 if none exist)
            const latestTag = tags.length > 0 ? tags[tags.length - 1] : 'v1.0.0';
            core.info(`==> Highest tag found in repository: ${latestTag}`);

            const [X, Y, Z] = latestTag.replace(/^v/, '').split('.').map(Number);
            let finalTag = '';
            let isPrerelease = true;
            let releaseTitlePrefix = 'Development';

            // 4. Pure Auto-increment Logic
            if (currentBranch === 'main') {
              finalTag = `v${X}.${Y + 1}.0`; // Increment Y, reset Z
              isPrerelease = false;
              releaseTitlePrefix = 'Release';
            } else {
              finalTag = `v${X}.${Y}.${Z + 1}`; // Increment Z
              isPrerelease = true;
              releaseTitlePrefix = 'Development';
            }


            const releaseTitle = `${releaseTitlePrefix} ${finalTag}`;
            core.info(`==> Calculated Final Tag: ${finalTag}`);

            // 5. Compress Source Code (tar.gz)
            const archiveName = `${repo}-${finalTag}.tar.gz`;
            const workspace = process.env.GITHUB_WORKSPACE;
            
            // Output tarball to parent directory to prevent "file changed as we read it" error
            const tempArchivePath = path.join(workspace, '..', archiveName);
            const finalArchivePath = path.join(workspace, archiveName);

            core.info(`==> Compressing workspace into ${archiveName}...`);
            // Execute shell command to compress
            execSync(`tar --exclude=.git --exclude=.DS_Store -czvf ${tempArchivePath} .`, { cwd: workspace });
            // Move it back
            fs.renameSync(tempArchivePath, finalArchivePath);

            // 6. Create local Git Tag and Push to remote safely
            core.info(`==> Pushing Tag ${finalTag} to remote...`);
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync(`git tag -a ${finalTag} -m "${releaseTitle}"`);
            
            try {
              execSync(`git push origin ${finalTag}`);
            } catch (error) {
              core.setFailed(`FAILED TO PUSH TAG: Tag ${finalTag} might already exist on remote.`);
              return;
            }

            // 7. Call GitHub API to Create the Release
            core.info('==> Creating GitHub Release...');
            const releaseResponse = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: finalTag,
              target_commitish: context.sha,
              name: releaseTitle,
              draft: false,
              prerelease: isPrerelease,
              generate_release_notes: true // Auto-generate changelog
            });

            // 8. Upload the .tar.gz Asset
            core.info('==> Uploading Release Asset...');
            const fileBuffer = fs.readFileSync(finalArchivePath);
            
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseResponse.data.id,
              name: archiveName,
              data: fileBuffer,
              headers: {
                'content-type': 'application/gzip',
                'content-length': fileBuffer.length
              }
            });

            core.info(`SUCCESS! Auto-Release created at: ${releaseResponse.data.html_url}`);