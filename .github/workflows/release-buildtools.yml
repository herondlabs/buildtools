name: Package and Release Build Tools

on:
  # Trigger automatically ONLY when code is pushed or merged to the main branch
  push:
    branches:
      - main
      
  # Allow manual trigger via GitHub Actions UI for any branch (Development builds)
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (X.Y.Z). Leave empty for auto-increment'
        required: false
        type: string
        default: ''

# Grant write permissions necessary for creating a GitHub Release
permissions:
  contents: write

jobs:
  package-and-release:
    name: Create tar.gz and Publish Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          clean: true

      - name: Determine Version, Tag, and Release Type
        id: get_version
        run: |
          # 0. Fetch all tags from remote to ensure local runner is up-to-date
          git fetch --tags --force
          
          # 1. CRITICAL FIX: Get the absolute highest tag in the repo using Version Sort (-V)
          # This ignores commit tree topology and simply finds the mathematically highest version
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          
          # If no tags exist at all, default to v1.0.0
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          
          echo "Highest tag found in repo: $LATEST_TAG"
          
          # Remove the 'v' prefix for arithmetic operations
          VERSION_ONLY=${LATEST_TAG#v}
          
          # Split the version string into X, Y, and Z components
          IFS='.' read -r X Y Z <<< "$VERSION_ONLY"
          
          # Get the current branch name
          CURRENT_BRANCH=${GITHUB_REF_NAME}
          echo "Current branch: $CURRENT_BRANCH"
          
          # Initialize defaults for Development builds
          IS_PRERELEASE="true"
          RELEASE_TITLE_PREFIX="Development"
          
          # 2. Calculate the final tag and determine release type
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            FINAL_TAG="${{ inputs.version }}"
            if [ "$CURRENT_BRANCH" == "main" ]; then
              IS_PRERELEASE="false"
              RELEASE_TITLE_PREFIX="Release"
            fi
          else
            # Auto-increment logic
            if [ "$CURRENT_BRANCH" == "main" ]; then
              NEW_Y=$((Y + 1))
              FINAL_TAG="v${X}.${NEW_Y}.0"
              IS_PRERELEASE="false"
              RELEASE_TITLE_PREFIX="Release"
            else
              NEW_Z=$((Z + 1))
              FINAL_TAG="v${X}.${Y}.${NEW_Z}"
              IS_PRERELEASE="true"
              RELEASE_TITLE_PREFIX="Development"
            fi
          fi
          
          # Ensure final tag string starts with 'v'
          FINAL_TAG="v${FINAL_TAG#v}"
          
          # Construct the full release title (e.g., "Development v1.0.1")
          RELEASE_TITLE="${RELEASE_TITLE_PREFIX} ${FINAL_TAG}"
          
          # Export to environment variables
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          
          echo "Determined Tag: $FINAL_TAG"
          echo "Release Title: $RELEASE_TITLE"

      - name: Create tar.gz archive
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          ARCHIVE_NAME="${REPO_NAME}-${{ env.FINAL_TAG }}.tar.gz"
          
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "Starting to compress the workspace into $ARCHIVE_NAME..."
          
          tar --exclude='.git' --exclude='.DS_Store' -czvf "../$ARCHIVE_NAME" .
          mv "../$ARCHIVE_NAME" .
          
          echo "Compression completed successfully."

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          # CRITICAL FIX: Explicitly tell GitHub to attach this tag/release to the exact commit SHA being built
          target_commitish: ${{ github.sha }}
          tag_name: ${{ env.FINAL_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: ${{ env.ARCHIVE_NAME }}
          draft: false 
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}